[package]
name = "tableau"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
openid = { version = "0.24", default-features = false, features = ["rustls"] }
axum = { version = "0.8.9", features = ["tracing"] }
redis = { version = "1.6.0", default-features = false,
    features = ["json", "aio", "connection-manager", "tokio-comp"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "tracing" ] }
tracing-subscriber = "0.3.23"
reqwest = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10.2"
base64 = "0.23.1"
